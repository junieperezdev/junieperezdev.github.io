# Run by hand (Actions tab → Update screenshots → Run workflow) after an intended visual change.
# Makes new baselines on GitHub's Linux runner and commits them.
name: Update screenshots
on: workflow_dispatch

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep "full-page screenshot" --update-snapshots
        env:
          UPDATE_SCREENSHOTS: "1"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add tests/screenshots
          git diff --cached --quiet || git commit -m "Update screenshot baselines"
          git push
